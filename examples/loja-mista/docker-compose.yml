services:
  web:
    build: ./app
    ports:
      - "8000:8000"
    env_file: .env.example
    environment:
      DATABASE_URL: postgres://shop:shop@db:5432/shop   # internal: Docker service name
      S3_ENDPOINT: http://minio:9000                      # internal: local MinIO, not Amazon
    depends_on: [db, cache, storage]

  worker:
    image: ghcr.io/fictional-shop/worker:1.4
    env_file: .env.example

  db:
    image: postgres:16

  cache:
    image: redis:7

  storage:
    image: minio/minio:latest
    command: server /data
